services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-mathuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mathpass}
      POSTGRES_DB: ${DB_NAME:-math_solved}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mathuser}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      provenance: false
      sbom: false
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER:-mathuser}
      DB_PASSWORD: ${DB_PASSWORD:-mathpass}
      DB_NAME: ${DB_NAME:-math_solved}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-llogis-change-me-in-production}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      provenance: false
      sbom: false
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
