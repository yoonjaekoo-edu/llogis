<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도지 마켓 | Logis</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#081120; color:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(180deg,#0a1426,#081120); }
    header { height:72px; display:flex; align-items:center; border-bottom:1px solid #24314a; background:#0b1425; }
    .wrap { width:min(980px,calc(100% - 32px)); margin:0 auto; }
    header .wrap { display:flex; align-items:center; justify-content:space-between; }
    a { color:inherit; text-decoration:none; }
    .brand { font-weight:900; font-size:22px; }
    .back { color:#9fb5d7; font-weight:700; }
    main { padding:56px 0; }
    .hero { display:grid; gap:20px; }
    .badge { width:max-content; padding:7px 12px; border-radius:999px; background:#f4bf32; color:#1b1607; font-weight:900; }
    h1 { margin:0; font-size:clamp(34px,7vw,64px); letter-spacing:-2px; }
    p { margin:0; color:#aebbd0; line-height:1.7; }
    .card { margin-top:28px; padding:24px; border:1px solid #263653; border-radius:22px; background:#111d31; box-shadow:0 20px 60px #0005; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    .doge { font-size:36px; font-weight:950; }
    .symbol { color:#f4bf32; font-weight:900; }
    .note { margin-top:16px; font-size:14px; color:#8293ae; }
    .btn { display:inline-block; margin-top:24px; padding:12px 18px; border-radius:12px; background:#5c95ff; font-weight:850; }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="/">Logis</a><a class="back" href="/">← 문제로 돌아가기</a></div></header>
  <main class="wrap">
    <section class="hero">
      <span class="badge">DOGE</span>
      <h1>도지 마켓</h1>
      <p>상단 메뉴에서 사라졌던 도지 마켓 진입점을 복구했어. 이 페이지는 Logis 내부 도지 마켓용 진입 페이지야.</p>
    </section>
    <section class="card">
      <div class="row">
        <div><div class="doge">Ð Dogecoin</div><div class="symbol">DOGE</div></div>
        <div>🐕</div>
      </div>
      <p class="note">현재는 마켓 UI 진입점만 복구한 상태야. 기존 거래/게임 로직을 다시 붙일 때 이 페이지를 교체하면 돼.</p>
      <a class="btn" href="/shop">Logis 상점 열기</a>
    </section>
  </main>
</body>
</html>
